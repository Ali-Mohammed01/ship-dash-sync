<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع - نظام شحنات الوقود</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-fuel-pump me-2"></i>
                نظام شحنات الوقود
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">الرئيسية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">لوحة التحكم</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="company.html">إدارة الشركة</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="driver.html">لوحة السائق</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex align-items-center mb-4">
            <a href="dashboard.html" class="btn btn-outline-secondary me-3">
                <i class="bi bi-arrow-right"></i>
            </a>
            <h1 class="h2 mb-0">الدفع</h1>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Order Summary -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">ملخص الطلب</h5>
                    </div>
                    <div class="card-body">
                        <div id="orderSummary">
                            <div class="row mb-2">
                                <div class="col-6">نوع الوقود:</div>
                                <div class="col-6 fw-bold" id="orderFuelType">-</div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">الكمية:</div>
                                <div class="col-6 fw-bold" id="orderQuantity">-</div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">المحطة المستهدفة:</div>
                                <div class="col-6 fw-bold" id="orderStation">-</div>
                            </div>
                            <hr>
                            <div class="row">
                                <div class="col-6"><strong>التكلفة الإجمالية:</strong></div>
                                <div class="col-6"><strong class="text-primary fs-5" id="totalCost">$0.00</strong></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Payment Form -->
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-credit-card me-2"></i>
                            تفاصيل الدفع
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="paymentForm">
                            <div class="mb-3">
                                <label for="holderName" class="form-label">اسم حامل البطاقة</label>
                                <input type="text" class="form-control" id="holderName" placeholder="أحمد محمد" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="cardNumber" class="form-label">رقم البطاقة</label>
                                <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="expiryDate" class="form-label">تاريخ الانتهاء</label>
                                    <input type="text" class="form-control" id="expiryDate" placeholder="MM/YY" maxlength="5" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="cvv" class="form-label">رمز الأمان</label>
                                    <input type="text" class="form-control" id="cvv" placeholder="123" maxlength="4" required>
                                </div>
                            </div>

                            <div class="d-flex align-items-center mb-3 text-muted">
                                <i class="bi bi-shield-check me-2"></i>
                                <small>معلومات الدفع محمية ومشفرة</small>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100" id="payButton">
                                <span id="payButtonText">دفع</span>
                                <span id="payButtonLoading" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/payment.js"></script>
</body>
</html>
